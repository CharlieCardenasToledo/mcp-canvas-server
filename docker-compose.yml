services:
    canvas-mcp-stdio:
        build: .
        command: ["sh", "-c", "node dist/index.js start"]
        environment:
            - CANVAS_API_TOKEN=${CANVAS_API_TOKEN:?set CANVAS_API_TOKEN}
            - CANVAS_API_DOMAIN=${CANVAS_API_DOMAIN:?set CANVAS_API_DOMAIN}
            - CANVAS_READ_ONLY=${CANVAS_READ_ONLY:-true}
        stdin_open: true
        tty: true

    canvas-mcp-http:
        build: .
        command: ["sh", "-c", "node dist/index.js serve-http --host 0.0.0.0 --port ${MCP_HTTP_PORT:-3000}"]
        ports:
            - "${MCP_HTTP_PORT:-3000}:3000"
        environment:
            - CANVAS_API_TOKEN=${CANVAS_API_TOKEN:?set CANVAS_API_TOKEN}
            - CANVAS_API_DOMAIN=${CANVAS_API_DOMAIN:?set CANVAS_API_DOMAIN}
            - CANVAS_READ_ONLY=${CANVAS_READ_ONLY:-true}
            - MCP_HTTP_AUTH_TOKEN=${MCP_HTTP_AUTH_TOKEN:?set MCP_HTTP_AUTH_TOKEN}
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
                ]
            interval: 30s
            timeout: 5s
            start_period: 10s
            retries: 3

    canvas-mcp-rest:
        build: .
        command: ["sh", "-c", "node dist/index.js serve-rest --host 0.0.0.0 --port ${REST_PORT:-3001}"]
        ports:
            - "${REST_PORT:-3001}:3001"
        environment:
            - CANVAS_API_TOKEN=${CANVAS_API_TOKEN:?set CANVAS_API_TOKEN}
            - CANVAS_API_DOMAIN=${CANVAS_API_DOMAIN:?set CANVAS_API_DOMAIN}
            - CANVAS_READ_ONLY=${CANVAS_READ_ONLY:-true}
            - REST_AUTH_TOKEN=${REST_AUTH_TOKEN:?set REST_AUTH_TOKEN}
