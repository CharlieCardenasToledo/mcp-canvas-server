name: Publish to npm

on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write

concurrency:
    group: npm-publish-${{ github.event.release.tag_name }}
    cancel-in-progress: false

jobs:
    publish:
        if: github.event.release.prerelease == false
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out the released tag
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.release.tag_name }}
                  fetch-depth: 0

            - name: Setup Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"
                  cache: npm

            - name: Use an OIDC-capable npm CLI
              run: npm install --global npm@latest

            - name: Install dependencies
              run: npm ci

            - name: Quality gate (lint, typecheck, tests, build)
              # format:check excluded: CHANGELOG.md is auto-generated by Release Please
              # and format was already validated on main before the tag was created.
              run: npm run lint && npm run typecheck && npm test && npm run build

            - name: Package tarball smoke
              run: npm run package:smoke

            - name: Validate release metadata
              id: release
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
              run: npm run release:check

            - name: Require the release commit to belong to main
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              shell: bash
              run: |
                  git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
                  git merge-base --is-ancestor HEAD "origin/${DEFAULT_BRANCH}"

            - name: Check whether version already exists on npm
              id: registry
              env:
                  PACKAGE_SPEC: ${{ steps.release.outputs.package_spec }}
              shell: bash
              run: |
                  if npm view "$PACKAGE_SPEC" version --json >/dev/null 2>&1; then
                      echo "published=true" >> "$GITHUB_OUTPUT"
                  else
                      npm ping
                      echo "published=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Publish with npm provenance
              if: steps.registry.outputs.published == 'false'
              run: npm publish --access public --provenance

            - name: Wait for registry consistency
              env:
                  PACKAGE_SPEC: ${{ steps.release.outputs.package_spec }}
                  PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
              shell: bash
              run: |
                  for attempt in $(seq 1 12); do
                      if remote_version=$(npm view "$PACKAGE_SPEC" version --json 2>/dev/null); then
                          remote_version="${remote_version//\"/}"
                          if [ "$remote_version" = "$PACKAGE_VERSION" ]; then
                              exit 0
                          fi
                      fi
                      sleep $((attempt * 5))
                  done
                  echo "Registry did not expose $PACKAGE_SPEC within the verification window" >&2
                  exit 1

            - name: Inspect the published tarball
              env:
                  PACKAGE_SPEC: ${{ steps.release.outputs.package_spec }}
              run: npm pack "$PACKAGE_SPEC" --dry-run --json
