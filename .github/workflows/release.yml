name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Release Please
              uses: googleapis/release-please-action@v5
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  skip-github-release: true
